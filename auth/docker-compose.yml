services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hydra
    volumes:
      - hydra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 5s
      retries: 10

  hydra-migrate:
    image: oryd/hydra:v2.3.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://hydra:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
    command: migrate sql -e --yes
    restart: on-failure

  hydra:
    image: oryd/hydra:v2.3.0
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://hydra:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${SECRETS_SYSTEM}
      URLS_SELF_ISSUER: http://localhost:4444
      URLS_LOGIN: http://localhost:3001/login
      URLS_CONSENT: http://localhost:3001/consent
      URLS_LOGOUT: http://localhost:3001/logout
      SERVE_PUBLIC_CORS_ENABLED: "true"
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: http://localhost:5173
      SERVE_COOKIES_SAME_SITE_MODE: Lax
    ports:
      - "4444:4444"
      - "4445:4445"
    command: serve all --dev

  login-consent:
    build:
      context: ..
      dockerfile: apps/login-consent-app/Dockerfile
    environment:
      PORT: 3001
      HYDRA_ADMIN_URL: http://hydra:4445
      TEST_USER_EMAIL: ${TEST_USER_EMAIL}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD}
    ports:
      - "3001:3001"
    depends_on:
      - hydra

volumes:
  hydra-postgres-data:
